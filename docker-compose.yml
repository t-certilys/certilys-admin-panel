services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim AS deps

        WORKDIR /app

        ENV PNPM_HOME="/pnpm"
        ENV PATH="$$PNPM_HOME:$$PATH"
        ENV NEXT_TELEMETRY_DISABLED=1

        RUN apt-get update \
          && apt-get install -y --no-install-recommends ca-certificates libc6 openssl \
          && rm -rf /var/lib/apt/lists/* \
          && corepack enable \
          && corepack prepare pnpm@11.7.0 --activate

        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./

        # pnpm 11 blocks dependency postinstall scripts unless approved. The
        # workspace file allowlists the native packages this app needs at build time.
        RUN pnpm install --frozen-lockfile

        FROM node:22-bookworm-slim AS build

        WORKDIR /app

        ENV PNPM_HOME="/pnpm"
        ENV PATH="$$PNPM_HOME:$$PATH"
        ENV NEXT_TELEMETRY_DISABLED=1

        RUN apt-get update \
          && apt-get install -y --no-install-recommends ca-certificates libc6 openssl \
          && rm -rf /var/lib/apt/lists/* \
          && corepack enable \
          && corepack prepare pnpm@11.7.0 --activate

        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        RUN pnpm build

        FROM node:22-bookworm-slim AS runtime

        WORKDIR /app

        ENV NODE_ENV=production
        ENV NEXT_TELEMETRY_DISABLED=1
        ENV PORT=3000
        ENV HOSTNAME=0.0.0.0

        RUN apt-get update \
          && apt-get install -y --no-install-recommends ca-certificates dumb-init \
          && rm -rf /var/lib/apt/lists/*

        RUN addgroup --system --gid 1001 nodejs \
          && adduser --system --uid 1001 nextjs

        COPY --from=build /app/public ./public
        COPY --from=build --chown=nextjs:nodejs /app/.next/standalone ./
        COPY --from=build --chown=nextjs:nodejs /app/.next/static ./.next/static

        USER nextjs

        EXPOSE 3000

        CMD ["dumb-init", "node", "server.js"]
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
